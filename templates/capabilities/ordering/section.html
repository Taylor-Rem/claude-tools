<!-- The "Order online" section for the home page. Put it after the menu (or
     after the hero if there is no menu section) and before "Find us", so the
     button is above the fold on a phone once they've seen what's on offer.
     Fill {{ORDER_URL}} and {{NAME}}. Delete the pickup/delivery line if the
     restaurant is pickup-only. -->
<section class="section" id="order">
  <div class="section-inner reveal">
    <p class="kicker">Order</p>
    <h2>Order online</h2>
    <p class="lede">Order straight from {{NAME}} — pickup or delivery, paid
    online, no app to download.</p>
    <p class="button-row">
      <a class="button order-button" href="{{ORDER_URL}}">Start an order</a>
    </p>
  </div>
</section>
