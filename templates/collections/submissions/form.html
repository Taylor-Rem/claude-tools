<!-- A form that keeps what people send (the submissions collection). Paste it
     where the client wants it; rename `_form` (quote, contact, booking) and
     the fields to fit. name / email / phone / message get their own columns
     in the list; any other field is kept too. Keep the `website` honeypot. -->
<form class="site-form" id="form" action="/api/submissions" method="post">
  <input type="hidden" name="_form" value="quote">
  <label>Name <input name="name" required autocomplete="name"></label>
  <label>Email <input name="email" type="email" required autocomplete="email"></label>
  <label>Phone <input name="phone" type="tel" autocomplete="tel"></label>
  <label>What do you need? <textarea name="message" rows="4" required></textarea></label>
  <input name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
  <button class="button" type="submit">Send</button>
  <p class="form-thanks" hidden>Thanks — we've got it and we'll be in touch.</p>
  <p class="form-sorry" hidden>That didn't go through. Please try again, or call us.</p>
  <script>
    (function () {
      var f = document.getElementById("form"), q = location.search;
      if (/[?&]sent=0/.test(q)) f.querySelector(".form-sorry").hidden = false;
      else if (/[?&]sent=/.test(q)) f.querySelector(".form-thanks").hidden = false;
    })();
  </script>
</form>
