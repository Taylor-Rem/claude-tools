<section class="panel {{FACE}}" data-rotate="{{ROT}}">
  <div class="words">
    <p class="kicker">{{NAME}}</p>
    <h1 data-fit="22">{{HEADLINE}}</h1>
    <div class="rule"></div>
    <p class="sub{{SUBCLASS}}">{{SUB}}</p>
  </div>
  <div class="code">
    {{QR}}
    <p class="url">{{URL}}</p>
    <p class="scan">Point your phone's camera here</p>
  </div>
</section>
